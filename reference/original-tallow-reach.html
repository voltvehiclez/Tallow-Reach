if(intro){p.innerHTML=`<h1>Tallow Reach</h1><div class="sub">A quiet, dangerous sector. Mine it, defend it, build on it.</div><p>You fly out of Meridian Outpost, your own station. Take contracts, cut ore from the asteroid field, fight off raiders, loot the wrecks, and bring it all home. If your ship is destroyed you lose it and its cargo, and must buy it again.</p><h2>Controls</h2><p>Mouse steers (distance from centre sets turn rate). W/S throttle, A/D strafe, Space and C move up and down, Q/E roll, Shift boost, X all stop. Left click fires your primary weapon and right click your secondary. Keys 1 and 2 switch the primary between cannons and the mining beam. Missiles lock on when a hostile stays inside the dashed ring for about a second. Right click then fires a homing missile, or a dumbfire missile if you have no lock. The mining beam and missiles are sold in the Shop. F locks whatever is nearest your crosshair, such as hostiles, rocks, crates or the station, and F again releases it. G docks when you are within 300 m of the station and slower than 70 m/s. P or Esc pauses, M mutes sound. Hold left Alt and move the mouse to orbit your ship, scroll to zoom.</p><button class="go" data-a="intro">Enter the hangar</button>`;return}
const tabs=[["m","Contracts"],["h","Hangar"],["p","Shop"],["b","Base"],["s","Saves"]];
let h=`<h1>Meridian Outpost</h1><div class="sub">${S.cr} cr. Contracts done ${S.done}. Kills ${S.kills}.</div><nav>${tabs.map(([k,n])=>`<button data-a="tab" data-b="${k}" class="${tab==k?"on":""}">${n}</button>`).join("")}</nav>`;
if(toast)h+=`<div class="ok">${toast}</div>`;
if(tab=="m"){const m=S.mission;if(m){h+=`<h2>Active contract</h2><div class="row"><div>${mt(m)}<small>Progress ${m.p}/${m.n}. Reward ${m.r} cr.</small></div>${m.p>=m.n?`<button data-a="done">Collect reward</button>`:`<button data-a="drop">Abandon</button>`}</div>`}
else{h+=`<h2>Contract board</h2>`+board.map((c,i)=>`<div class="row"><div>${mt(c)}<small>Threat ${c.tier} of 3. Reward ${c.r} cr.</small></div><button data-a="acc" data-b="${i}">Accept</button></div>`).join("")+`<div class="row"><small>Contracts reshuffle every time you refresh.</small><button data-a="ref">Refresh</button></div>`}}
if(tab=="h"){h+=`<h2>Hangar</h2><div class="sub">Berths ${S.ships.length}/${S.base.hangar+1}</div>`+repairs()+Object.keys(SH).map(id=>{const s=SH[id],own=S.ships.includes(id);
return`<div class="row"><div>${s.n}<small>${s.d} Hull ${s.hull}, shield ${s.sh}, hold ${s.cargo}.</small></div>${own?(S.ship==id?`<span class="ok">In use</span>`:`<button data-a="sel" data-b="${id}">Fly</button>`):`<button data-a="buy" data-b="${id}" ${S.cr<s.price||S.ships.length>=S.base.hangar+1?"disabled":""}>Buy ${s.price} cr</button>`}</div>`}).join("")}
if(tab=="b"){h+=`<h2>Cargo and storage</h2><div class="sub">Hold ${load()}/${sd.cargo}. Storage ${used()}/${cap()}. Refinery bonus +${15*S.base.refinery}%.</div>`+KEYS.map(k=>`<div class="row"><div>${ITEM[k].n}<small>${S.cargo[k]} in hold, ${S.store[k]} stored, ${ITEM[k].v} cr each</small></div></div>`).join("")+
`<div class="row"><button data-a="dep">Store hold</button><button data-a="wd">Load stored</button><button data-a="sellh" ${load()?"":"disabled"}>Sell hold ${val(S.cargo)} cr</button><button data-a="sells" ${used()?"":"disabled"}>Sell stored ${val(S.store)} cr</button></div><h2>Base modules</h2>`+
[["store","Storage bay","Adds 250 units of storage."],["hangar","Hangar berth","Room for another ship."],["refinery","Refinery","Sells cargo for 15% more."]].map(([k,n,d])=>{const l=S.base[k],mx=k=="refinery"?4:5,c=cost[k](l);return`<div class="row"><div>${n} level ${l}<small>${d}</small></div><button data-a="up" data-b="${k}" ${l>=mx||S.cr<c?"disabled":""}>${l>=mx?"Maxed":"Build "+c+" cr"}</button></div>`}).join("")}
if(tab=="p"){h+=`<h2>Weapons shop</h2><div class="sub">Left click fires your primary weapon (keys 1 and 2 switch). Right click fires your secondary weapon.</div><div class="row"><div>Autocannons<small>Primary. Standard issue.</small></div><span class="ok">Owned</span></div>`+[["beam","Mining beam","Primary. Cuts ore from asteroids. Press 2 in flight to equip it.",900],["msl","Missile launcher","Secondary. Keep a hostile inside the dashed ring to lock on, or fire without a lock. Includes 8 missiles.",1500]].map(([k,n,d,c])=>`<div class="row"><div>${n}<small>${d}</small></div>${S.wp[k]?`<span class="ok">Owned</span>`:`<button data-a="wb" data-b="${k}" ${S.cr<c?"disabled":""}>Buy ${c} cr</button>`}</div>`).join("")+(S.wp.msl?`<div class="row"><div>Missile stock<small>${S.msl} of ${MSL.cap} loaded. 35 cr each.</small></div><button data-a="wr" ${S.msl>=MSL.cap||S.cr<35?"disabled":""}>Restock ${Math.min(MSL.cap-S.msl,Math.floor(S.cr/35))*35} cr</button></div>`:"")}
if(tab=="s"){h+=`<h2>Save slots</h2><div class="sub">Your game also autosaves in this browser whenever you dock or change something here.</div>`+[1,2,3].map(i=>{const s=slotInfo(i);return`<div class="row"><div>Slot ${i}<small>${s?`${s.cr} cr, ${s.ships.length} ships, ${s.done} contracts`:"Empty"}</small></div><div><button data-a="sv" data-b="${i}">Save</button> <button data-a="ld" data-b="${i}" ${s?"":"disabled"}>Load</button> <button data-a="dl" data-b="${i}" ${s?"":"disabled"}>Delete</button></div></div>`}).join("")+`<h2>Reset progress</h2>`+(rconf?`<div class="row"><div>Wipe credits, ships, base and contracts? Save slots are kept.</div><div><button data-a="rs2">Yes, reset</button> <button data-a="rs0">Cancel</button></div></div>`:`<div class="row"><div>Start again from scratch<small>Resets the current game, not your save slots.</small></div><button data-a="rs1">Reset</button></div>`)+`<h2>Export and import</h2><div class="sub">Export gives you a text code for your whole game. Paste a code below and press Import to load it. Importing replaces your current game.</div><textarea id="xt" rows="4" spellcheck="false" placeholder="Paste a save code here">${xcode}</textarea><div class="row"><button data-a="xp">Export</button><button data-a="im">Import</button></div>`}
const own=S.ships.includes(S.ship);
h+=`<button class="go" data-a="go" ${own?"":"disabled"}>${own?"Launch":"Buy a ship in the Hangar to launch"}</button>`;p.innerHTML=h}
const ACT={intro:()=>{intro=false;tab="m";initAudio()},tab:b=>{tab=b;toast="";rconf=false},go:()=>launch(),
sv:i=>{try{localStorage.setItem("tr_s"+i,JSON.stringify(S));toast="Saved to slot "+i}catch(e){toast="Could not save in this browser."}},
ld:i=>{const s=slotInfo(i);if(!s)return;S=Object.assign(fresh(),s);setShip(S.ship);board=gen();lockT=null;toast="Loaded slot "+i},
dl:i=>{try{localStorage.removeItem("tr_s"+i)}catch(e){}toast="Deleted slot "+i},
xp:()=>{xcode="TR1:"+btoa(JSON.stringify(S));try{navigator.clipboard.writeText(xcode).catch(()=>{})}catch(e){}toast="Your save code is in the box below. It was also copied if your browser allows it."},
im:()=>{const v=($("xt")||{}).value||"";xcode=v;try{S=clean(JSON.parse(atob(v.trim().replace(/^TR1:/,""))));setShip(S.ship);board=gen();lockT=null;xcode="";toast="Save imported."}catch(e){toast="That code is not a valid save."}},
wb:k=>{const c=k=="beam"?900:1500;if(S.cr<c)return;S.cr-=c;S.wp[k]=true;if(k=="msl")S.msl=Math.max(S.msl,8);toast=k=="beam"?"Mining beam installed. Press 2 in flight to equip it.":"Missile launcher installed with 8 missiles."},
rp:id=>{const c=rcost(id);if(S.cr<c||c<=0)return;S.cr-=c;S.hp=S.hp||{};S.hp[id]=1;if(id==S.ship)P.hull=P.hullMax;toast=`${SH[id].n} repaired for ${c} cr.`},
wr:()=>{const n=Math.min(MSL.cap-S.msl,Math.floor(S.cr/35));S.cr-=n*35;S.msl+=n;toast=`Restocked ${n} missiles.`},
rs1:()=>rconf=true,rs0:()=>rconf=false,rs2:()=>{S=fresh();setShip("wasp");board=gen();lockT=null;rconf=false;toast="Progress reset."},ref:()=>board=gen(),
acc:b=>{S.mission=board[b];board=gen();toast="Contract accepted. Launch when ready."},drop:()=>S.mission=null,
done:()=>{S.cr+=S.mission.r;S.done++;toast=`Paid ${S.mission.r} cr.`;S.mission=null},
sel:b=>{if(load()>SH[b].cargo){toast="Store your cargo first. It will not fit in that ship.";return}S.ship=b;setShip(b)},
buy:b=>{S.cr-=SH[b].price;S.ships.push(b);if(S.hp)delete S.hp[b];if(b==S.ship)setShip(b)},
dep:()=>{let n=0;KEYS.forEach(k=>{const t=Math.min(S.cargo[k],cap()-used());S.cargo[k]-=t;S.store[k]+=t;n+=t});toast=n?`Stored ${n} units.`:"Storage is full."},
wd:()=>{KEYS.forEach(k=>{const t=Math.min(S.store[k],SH[S.ship].cargo-load());S.store[k]-=t;S.cargo[k]+=t})},
sellh:()=>{S.cr+=val(S.cargo);S.cargo=zero()},sells:()=>{S.cr+=val(S.store);S.store=zero()},
up:b=>{S.cr-=cost[b](S.base[b]);S.base[b]++}};
function click(a){if(a=="go"){tone(200,420,.25,.08,"triangle");nz(.2,1800,.12)}else if(["buy","up","done","sellh","sells","wb","wr","rp"].includes(a)){tone(660,990,.08,.06,"triangle");setTimeout(()=>tone(990,1320,.1,.05,"triangle"),70)}else{tone(900,600,.045,.07);tone(450,300,.05,.04)}}
$("panel").addEventListener("mouseover",e=>{if(e.target.closest("button:not(:disabled)"))tone(900,900,.03,.015)});
$("panel").addEventListener("click",e=>{const b=e.target.closest("button[data-a]");if(!b||b.disabled)return;ACT[b.dataset.a](b.dataset.b);click(b.dataset.a);save();if(b.dataset.a!="go")ui()});
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(paused){ren.render(scene,cam);return}time+=dt;
planet.rotation.y+=dt*.003;spin.rotation.y+=dt*.1;stars.position.copy(cam.position);audio();
if(P.docked){const t=time*.06;cam.position.set(Math.cos(t)*380,90,Math.sin(t)*380);cam.lookAt(0,0,0)}
else{flight(dt);weapons(dt);missiles(dt);ai(dt);world(dt);const sc=SH[S.ship].sc,tp=P.m.localToWorld(V(0,2.6,11).multiplyScalar(1));
if(P.snap){cam.position.copy(tp);cam.quaternion.copy(P.m.quaternion);P.snap=false}
if(fc.on){const c=Math.cos(fc.pitch),o=V(Math.sin(fc.yaw)*c,Math.sin(fc.pitch),Math.cos(fc.yaw)*c).multiplyScalar(fc.dist).applyQuaternion(P.m.quaternion).add(P.m.position);cam.position.copy(o);face(cam,P.m.position,1)}else{cam.position.lerp(tp,1-Math.exp(-10*dt));cam.quaternion.slerp(P.m.quaternion,1-Math.exp(-5*dt))}
cam.fov+=((70+4*(P.bs||0))-cam.fov)*Math.min(1,dt*4);cam.updateProjectionMatrix();hud()}
P.shake=(P.shake||0)*Math.exp(-dt*6);const sk=P.shake>.01?V(R(-1,1),R(-1,1),R(-1,1)).multiplyScalar(P.shake*.3*SH[S.ship].sc):null;if(sk)cam.position.add(sk);ren.render(scene,cam);if(sk)cam.position.sub(sk)}
ui();requestAnimationFrame(loop);
</script></body></html>
