<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tallow Reach</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600&display=swap" rel="stylesheet">
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="hud" hidden>
<div id="tl"><div id="hud-location"><strong id="system-name"></strong><span id="pocket-name"></span></div><section id="hud-route" aria-label="Route" hidden></section></div>
<div id="pocket-objects" hidden><header><span>Pocket objects</span><details id="pocket-filters-details"><summary>Filters</summary><div id="pocket-filters"></div></details><button id="close-pocket-objects" type="button">Close · N</button></header><div id="pocket-filter-presets"></div><div id="pocket-preset-menu-slot"></div><div class="pocket-tools"><button type="button" data-pocket-sort="name" aria-pressed="false">Name</button><button type="button" data-pocket-sort="type" aria-pressed="false">Type</button><button type="button" class="pocket-sort-distance" data-pocket-sort="distance" aria-pressed="true">Distance ↑</button></div><ul id="pocket-object-rows"></ul></div>
<div id="weapon-lead" hidden aria-label="Cannon intercept point"></div>
<div id="weapon-slots" aria-label="Weapon selection"></div>
<div id="tr"></div><div id="bc"><div id="throttle-track"><i id="throttle-fill"></i><span id="throttle-label">Throttle 0%</span><span id="speed"></span></div></div>
<div id="ship-vitals" aria-label="Ship status">
<div class="vital-pair vital-left">
<div class="vital-column vital-shield"><span>Shield</span><div class="vital-track"><i id="b1"></i></div><span class="vital-value" id="sh-val"></span><span class="vital-percent" id="sh-pct"></span></div>
<div class="vital-column vital-hull"><span>Hull</span><div class="vital-track"><i id="b2"></i></div><span class="vital-value" id="hull-val"></span><span class="vital-percent" id="hull-pct"></span></div>
</div>
<div class="vital-pair vital-right">
<div id="pw" class="vital-column vital-power"><span>Power</span><div class="vital-track"><i id="pwbar"></i></div><span class="vital-value" id="pw-val"></span><span class="vital-percent" id="pw-pct"></span><div id="pw-flow"></div></div>
<div class="vital-column vital-boost"><span>Boost</span><div class="vital-track"><i id="b3"></i></div><span class="vital-value" id="boost-val"></span><span class="vital-percent" id="boost-pct"></span></div>
</div>
</div>
<div id="pr"></div><div id="bm" hidden><div class="bm-line"><span id="bm-name">Basic mining beam</span><span id="bm-pct">0%</span></div><div class="bar"><i id="bmbar" style="width:0;background:var(--amber)"></i></div></div><div id="msg"></div><div id="cur"></div><div id="ctr"></div><div id="mcone"></div><canvas id="retc" width="260" height="260"></canvas></div>
<div id="mk"></div><div id="flash"></div><aside id="station-left" class="station-side-panel" hidden aria-label="Station window"></aside><div id="panel"></div>
<script>
/*__JS__*/
</script>
</body>
</html>
