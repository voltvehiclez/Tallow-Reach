<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tallow Reach</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Tallow Reach styles. Colours are the variables in :root. Sections: page, flight HUD, outpost panel, pause overlay. */

/* ---- Page ---- */
:root {
  --bg:#07090b;
  --ink:#c9d1d6;
  --dim:#6f7b84;
  --amber:#e0a458;
  --red:#d0503f;
  --ice:#7fb7c4;
  --line:#27323a;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.4 "Barlow Semi Condensed",system-ui,sans-serif;
  overflow: hidden;
}

canvas {
  display: block;
  position: fixed;
  inset: 0;
  cursor: none;
}

/* ---- Flight HUD (top-left bars, top-right info, centre messages, markers) ---- */
#hud>div {
  position: fixed;
  pointer-events: none;
  text-shadow: 0 1px 3px #000;
}

#tl {
  left: 20px;
  top: 20px;
  width: 210px;
}
/* A label with its reading on the right, like the power block's "100 / 100 MJ". */
#tl .tl-label {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}
#tl .tl-shield { color: var(--ice); }
#tl .tl-hull { color: var(--ink); }
#tl .tl-boost { color: var(--amber); }
#tl .tl-label span {
  font-variant-numeric: tabular-nums;
}
/* Remaining system names while flying. The ship HUD shows the complete route without an inner scroller. */
#hud-route {
  margin-top: 12px;
  pointer-events: auto;
  color: var(--ink);
  font-size: 13px;
}
#hud-route[hidden] { display: none; }
#hud-route h3 { margin: 0 0 5px; color: var(--amber); font-size: 13px; overflow-wrap: anywhere; }
#hud-route .route-count { display: inline-block; white-space: nowrap; overflow-wrap: normal; }
#hud-route ol, .sm-route-list { list-style: none; margin: 0; padding: 0; position: relative; }
#hud-route li { line-height: 18px; overflow-wrap: anywhere; }
#hud-route ol:has(li + li)::before, .sm-route-list:has(li + li)::before { content: ""; position: absolute; z-index: 0; left: 8px; top: 7px; bottom: 7px; border-left: 1px solid rgba(224,164,88,.35); pointer-events: none; }
#hud-route li > .route-marker, .sm-route-list li > .route-marker { z-index: 1; }
#hud-route li span { color: var(--amber); }
#hud-route .route-here, #hud-route p.route-here, .sm-route li.route-here { color: var(--ice); }
#hud-route li.route-destination, .sm-route li.route-destination { color: var(--amber); font-weight: bold; }
#hud-route li small, .sm-route li small { color: var(--dim); font-weight: normal; }
#hud-route li.route-here.route-destination, .sm-route li.route-here.route-destination { color: var(--ice); }
.route-marker { display: inline-block; position: relative; width: 12px; height: 12px; margin: 0 8px 0 2px; vertical-align: -2px; border-radius: 50%; flex: 0 0 auto; }
.route-marker-start { background: var(--amber); border: 2px solid #ffd58e; box-shadow: 0 0 0 2px rgba(224,164,88,.22), 0 0 6px rgba(224,164,88,.45); }
.route-marker-start::after { content: ""; position: absolute; width: 4px; height: 4px; top: 2px; left: 2px; border: 1px solid #fff1c7; border-radius: 50%; }
.route-marker-intermediate { width: 9px; height: 9px; margin-left: 4px; margin-right: 10px; background: #5a7a86; border: 2px solid var(--ice); }
.route-marker-destination { background: #07090b; border: 1px solid var(--amber); box-shadow: none; }
.route-marker-destination::after { content: ""; position: absolute; inset: -6px; border: 1px dotted var(--amber); border-radius: 50%; opacity: .95; }
.route-marker-destination-tick { position: absolute; width: 4px; height: 7px; top: 1px; left: 3px; border: solid var(--amber); border-width: 0 2px 2px 0; transform: rotate(45deg); }
#hud-route li.route-here.route-destination .route-marker, .sm-route li.route-here.route-destination .route-marker { border-color: var(--amber); }
#hud-route p { margin: 5px 0; color: var(--dim); font-size: 12px; }
#tr {
  right: 20px;
  top: 20px;
  text-align: right;
  max-width: 340px;
}
#tr .hud-missions {
  display: grid;
  gap: 2px;
  margin-top: 2px;
}
#tr .hud-mission {
  color: var(--amber);   /* story missions: the special colour */
  overflow-wrap: anywhere;
}
#tr .hud-mission.hud-mission-contract {
  color: var(--ice);     /* contracts are ordinary work */
}
#tr .hud-mission strong {
  display: block;
}
#tr .hud-mission-objective {
  display: block;
  color: var(--ink);
  font-size: 12px;
  line-height: 1.25;
}
#tr .hud-mission small {
  display: block;
  color: var(--dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
#bc {
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  text-align: center;
}

/* Ship power, bottom centre, above the throttle line (#bc). */
#pw {
  left: 50%;
  bottom: 56px;
  transform: translateX(-50%);
  width: 236px;
  text-align: center;
}
#pw .pw-line {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 13px;
  color: var(--dim);
}
#pw #pw-val {
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
#pw .bar {
  height: 5px;
  margin: 4px 0 3px;
}
#pw #pw-flow {
  font-size: 11px;
  letter-spacing: .04em;
  color: var(--dim);
}
/* Beam progress toward the next ore: a small bar directly under the "N left
   in rock" hint, shown only while the beam is cutting. */
#bm {
  left: 50%;
  top: calc(62% + 24px);
  transform: translateX(-50%);
  width: 150px;
  text-align: center;
}
#bm .bm-line {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 11px;
  color: var(--dim);
}
#bm #bm-pct {
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
#bm .bar {
  height: 4px;
  margin: 2px 0 0;
}
/* Narrow windows: the controls list in the bottom-left is several lines tall,
   so lift the power block above it rather than printing over it. */
@media (max-width: 900px) {
  #pw {
    bottom: 132px;
  }
}

#hint {
  left: 20px;
  bottom: 20px;
  color: var(--dim);
  font-size: 13px;
  max-width: 300px;
}

#pr {
  left: 50%;
  top: 62%;
  transform: translateX(-50%);
  color: var(--amber);
  text-align: center;
}

#cur {
  width: 14px;
  height: 14px;
  border: 1px solid var(--amber);
  border-radius: 50%;
  transform: translate(-50%,-50%);
  left: 50%;
  top: 50%;
}

#mcone {
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  border: 1px dashed rgba(224,164,88,.22);
  border-radius: 50%;
  display: none;
}

#retc {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  pointer-events: none;
}

#ctr {
  left: 50%;
  top: 50%;
  width: 4px;
  height: 4px;
  background: var(--ink);
  border-radius: 50%;
  transform: translate(-50%,-50%);
  opacity: .6;
}

.bar {
  height: 6px;
  background: #141b20;
  margin: 4px 0 10px;
}
.bar i {
  display: block;
  height: 100%;
  width: 50%;
}

#msg {
  left: 50%;
  top: 14%;
  transform: translateX(-50%);
  color: var(--ink);
  font-size: 18px;
}

.mk {
  position: fixed;
  display: none;
  transform: translate(-50%,-50%);
  font-size: 12px;
  color: var(--amber);
  border: 1px solid currentColor;
  padding: 1px 6px;
  background: rgba(7,9,11,.5);
  white-space: nowrap;
  pointer-events: none;
}
.mk.h {
  color: var(--red);
}
.mk.i {
  color: var(--ice);
}
.mk.dim {
  opacity: .55;
}
.mk.lock {
  background: rgba(224,164,88,.22);
  color: #ffe2b8;
}
.mk.lock.h {
  background: rgba(208,80,63,.25);
  color: #ffb4a8;
}
.mk.lk {
  width: 36px;
  height: 36px;
  padding: 0;
  background: none;
}

#flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 160px 40px var(--red);
  opacity: 0;
  transition: opacity .4s;
}

/* ---- Outpost panel (docked screens) ---- */
#panel {
  position: fixed;
  right: 0;
  top: 0;
  bottom: 0;
  width: min(580px,100%);
  padding: 28px;
  background: rgba(7,9,11,.9);
  backdrop-filter: blur(6px);
  border-left: 1px solid var(--line);
  overflow: auto;
}

/* ---- Panel notice: a message the pilot must read. Fixed to the viewport, so it
   never pushes a row of the docked panel (or anything else) out of place. ---- */
#panel-notice {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  z-index: 80;
  max-width: min(560px, calc(100% - 40px));
  padding: 10px 16px;
  background: rgba(10, 16, 20, .94);
  border: 1px solid var(--ice);
  box-shadow: 0 8px 24px rgba(0,0,0,.5);
  color: #dceef4;
  font-size: 13px;
  line-height: 1.35;
  pointer-events: auto;
  cursor: pointer;
}
#panel-notice[hidden] { display: none; }

/* ---- Mission failed notice: over the flight HUD and the docked screen ---- */
#mission-alert {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 80;
  display: grid;
  gap: 4px;
  width: min(560px, calc(100% - 40px));
  padding: 12px 16px;
  background: rgba(40, 12, 12, .94);
  border: 1px solid #d9534f;
  box-shadow: 0 8px 24px rgba(0,0,0,.5);
  color: #f3d9d6;
  cursor: pointer;
  pointer-events: auto;
}
#mission-alert[hidden] { display: none; }
#mission-alert strong { color: #ff8a80; letter-spacing: .04em; }
#mission-alert em { font-size: 11px; opacity: .6; font-style: normal; }

/* ---- Mission log and live dialogue (step 13c) ---- */
#dialogue-panel {
  position: fixed;
  left: 20px;
  bottom: 20px;
  z-index: 60;
  width: min(680px, calc(100% - 40px));
  pointer-events: auto;
}
#dialogue-panel[hidden] { display: none; }
.dialogue-shell {
  display: grid;
  grid-template-columns: 96px minmax(0, 1fr);
  gap: 14px;
  padding: 14px;
  border: 1px solid var(--amber);
  background: rgba(7,9,11,.94);
  box-shadow: 0 8px 28px rgba(0,0,0,.5);
}
.dialogue-portrait {
  display: grid;
  place-items: center;
  min-height: 96px;
  padding: 8px;
  border: 1px solid var(--line);
  color: var(--ice);
  background: radial-gradient(circle, rgba(127,183,196,.16), rgba(13,18,21,.85));
  text-align: center;
  font-size: 12px;
  overflow-wrap: anywhere;
}
.dialogue-body { min-width: 0; }
.dialogue-meta,
.dialogue-body h2 {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.dialogue-meta {
  color: var(--dim);
  font-size: 12px;
  letter-spacing: .04em;
}
.dialogue-body h2 {
  margin: 4px 0 4px;
  color: var(--amber);
  font-size: 20px;
}
.dialogue-text {
  min-height: 2.8em;
  margin: 8px 0 12px;
  color: var(--ink);
}
.dialogue-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.dialogue-choice,
.dialogue-next { padding: 6px 12px; }
.dialogue-locked {
  margin: 0;
  padding: 6px 0;
  color: var(--amber);
  font-style: italic;
}
.mission-log-card {
  margin: 10px 0;
  padding: 12px;
  border: 1px solid var(--line);
  background: rgba(20,27,32,.45);
}
.mission-log-card header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.mission-log-card h3 {
  margin: 0;
  color: var(--ice);
  font-size: 17px;
}
.mission-log-card header span,
.mission-log-status,
.mission-log-dialogue {
  color: var(--dim);
  font-size: 13px;
}
.mission-log-status { margin: 5px 0 4px; }
.mission-log-status span { color: var(--dim); }
.mission-log-bar {
  height: 4px;
  margin: 6px 0 9px;
  background: #141b20;
}
.mission-log-bar i {
  display: block;
  height: 100%;
  background: var(--amber);
}
.mission-log-dialogue {
  margin: 8px 0;
  padding-left: 10px;
  border-left: 2px solid var(--ice);
}
.mission-log-dialogue strong { color: var(--ice); }
.mission-log-next { margin: 8px 0; }
.mission-log-next strong { color: var(--amber); }
.mission-log-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* ---- Shared text and buttons ---- */
h1 {
  font-size: 30px;
  font-weight: 600;
  margin: 0 0 2px;
}
h2 {
  font-size: 18px;
  margin: 22px 0 6px;
  font-weight: 600;
}
.sub {
  color: var(--dim);
  margin-bottom: 14px;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

button {
  font: inherit;
  color: var(--amber);
  background: transparent;
  border: 1px solid var(--amber);
  padding: 5px 14px;
  cursor: pointer;
}

button:hover:not(:disabled),
button.on {
  background: var(--amber);
  color: #000;
}
button:disabled {
  color: var(--dim);
  border-color: var(--line);
  cursor: default;
}

button:focus-visible {
  outline: 2px solid var(--ice);
  outline-offset: 2px;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.row small {
  color: var(--dim);
  display: block;
}

.go {
  margin-top: 22px;
  width: 100%;
  padding: 10px;
  font-size: 18px;
}
.main-menu-actions {
  display: grid;
  gap: 10px;
  margin-top: 22px;
}
.main-menu-actions .go { margin-top: 0; }
/* ---- Outfitting: the ship in the middle, module bays around it ---- */
/* This tab opens the panel up to the middle of the screen, because the ship
   needs room to be looked at. Everything else stays where it was. */
#panel.wide {
  left: 0;
  right: 0;
  margin: 0 auto;
  width: min(1180px, 100%);
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
}

.outfit {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(300px, 1.35fr) minmax(0, 1fr);
  gap: 14px;
  align-items: start;
}

.outfit-rail {
  display: grid;
  gap: 10px;
}

/* One module group. The same shape is used for every group, so a new entry in
   MODULE_GROUPS (src/data/outfitting.js) needs no styling of its own. */
.mod {
  border: 1px solid var(--line);
  background: rgba(20, 27, 32, .55);
  padding: 9px 11px 10px;
}
.mod header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}
.mod h3 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .07em;
  text-transform: uppercase;
}
.mod-count {
  color: var(--dim);
  font-size: 12px;
  white-space: nowrap;
}
.mod-bays {
  display: flex;
  gap: 8px;
}
/* The bay box itself. Module bays are buttons and paint bays are plain divs, so
   the look lives on the bare class and only the button behaviour is added below.
   (Putting the box on `button.mod-bay` left the paint bays unstyled: they came
   out as bare inline text reading "PRIMARYEmpty".) */
.mod-bay {
  flex: 1;
  min-width: 0;
  display: grid;
  gap: 1px;
  padding: 6px 8px 7px;
  border: 1px dashed var(--line);
  background: repeating-linear-gradient(
    135deg,
    transparent 0 6px,
    rgba(127, 183, 196, .05) 6px 12px
  );
}

/* A module bay is a button: clicking it opens the picker under the card. It
   keeps the dashed "empty socket" look instead of the amber button style. */
button.mod-bay {
  font: inherit;
  text-align: left;
  color: inherit;
  cursor: pointer;
}
button.mod-bay:hover:not(:disabled) {
  color: inherit;
  border-color: var(--amber);
  background: rgba(224, 164, 88, .10);
}
button.mod-bay.on {
  color: inherit;
  border-color: var(--ice);
  background: rgba(127, 183, 196, .12);
}
.bay-no {
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--dim);
}
.bay-empty {
  font-size: 13px;
  color: #57656e;
}
/* A bay with a module in it: solid edge, the part's name, its headline number. */
.mod-bay.fitted {
  border-style: solid;
  border-color: #3c4a54;
  background: linear-gradient(180deg, rgba(127, 183, 196, .10), rgba(127, 183, 196, .02));
}
.bay-val {
  font-size: 13px;
  color: var(--ink);
}
.bay-stat {
  font-size: 11px;
  color: var(--ice);
}
/* The picker: a box under the bays holding one square per stored part. */
.fit-picker {
  margin-top: 8px;
  border: 1px solid var(--line);
  background: #0a0e11;
  padding: 8px;
}
.fit-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--dim);
}
.fit-close {
  padding: 1px 8px;
  font-size: 11px;
}
.fit-squares {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(94px, 1fr));
  gap: 6px;
}
.fit-sq {
  display: grid;
  align-content: start;
  gap: 2px;
  min-height: 56px;
  padding: 6px 8px;
  text-align: left;
  font-size: 12px;
  line-height: 1.2;
}
.fit-sq small {
  color: var(--ice);
  font-size: 11px;
}
.fit-empty {
  border: 1px dashed var(--line);
  padding: 12px 10px;
  text-align: center;
  color: var(--dim);
  font-size: 12px;
}
.fit-unfit {
  width: 100%;
  margin-top: 8px;
  padding: 4px 8px;
  font-size: 12px;
}

.mod p {
  margin: 8px 0 0;
  font-size: 12px;
  line-height: 1.25;
  color: var(--dim);
}

/* The window the ship is shown in. Its own canvas, its own renderer; see
   render/shipviewer.js. The gradients sit behind the transparent canvas. */
.outfit-view {
  position: relative;
  min-height: 460px;
  border: 1px solid var(--line);
  overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 38%, rgba(127, 183, 196, .10), transparent 62%),
    radial-gradient(90% 70% at 50% 102%, rgba(224, 164, 88, .10), transparent 72%),
    #070a0c;
}
.outfit-stage {
  position: absolute;
  inset: 0;
}
.outfit-stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  cursor: grab;
  touch-action: none;
}
.outfit-stage canvas.dragging {
  cursor: grabbing;
}
.outfit-title {
  position: absolute;
  left: 14px;
  top: 12px;
  z-index: 2;
  pointer-events: none;
  font-size: 15px;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.outfit-title small {
  display: block;
  margin-top: 1px;
  font-size: 12px;
  letter-spacing: 0;
  text-transform: none;
  color: var(--dim);
}
.outfit-tip {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 9px;
  z-index: 2;
  padding: 0 12px;
  text-align: center;
  font-size: 11px;
  letter-spacing: .05em;
  color: var(--dim);
  pointer-events: none;
}
.outfit-stage.no-webgl .outfit-tip {
  top: 50%;
  bottom: auto;
  transform: translateY(-50%);
}

/* The ship switcher above the 3D viewer: arrows cycling the ships in the
   hangar, the middle showing which one and where it sits in the collection. */
.outfit-mid {
  display: grid;
  gap: 10px;
  min-width: 0;
}
.ship-switch {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border: 1px solid var(--line);
  background: rgba(20, 27, 32, .55);
  padding: 6px 10px;
}
.ship-arrow {
  flex: 0 0 auto;
  padding: 1px 15px 3px;
  font-size: 21px;
  line-height: 1.1;
}
.ship-switch-mid {
  min-width: 0;
  text-align: center;
}
.ship-switch-name {
  font-size: 14px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--amber);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ship-switch-count {
  margin-top: 1px;
  font-size: 11px;
  color: var(--dim);
}

/* Ship services for the hull in the viewer: paid repair of its plating and
   paid missile restock. Two rows in one bordered box, under the viewer. */
.outfit-service {
  border: 1px solid var(--line);
  background: rgba(20, 27, 32, .55);
  padding: 8px 12px 9px;
}
.outfit-service-title {
  margin-bottom: 2px;
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--dim);
}
.outfit-service .row {
  padding: 8px 0;
}
.outfit-service .row:last-child {
  border-bottom: none;
  padding-bottom: 2px;
}

/* ---- Inventory: the station's store on top, one ship's hold below ---- */
/* Two stacked boxes in the normal outpost panel. The ship switcher between them
   reuses .ship-switch from the Outfitting tab. */
.inv-col {
  border: 1px solid var(--line);
  background: rgba(20, 27, 32, .55);
  padding: 8px 12px 10px;
}
.inv-col header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 2px;
}
.inv-col h3 {
  margin: 0;
  font-size: 12px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ice);
}
.inv-grid {
  --inv-row-height: 68px;
  --inv-row-gap: 6px;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  grid-auto-rows: var(--inv-row-height);
  gap: var(--inv-row-gap);
  height: calc(3 * var(--inv-row-height) + 2 * var(--inv-row-gap));
  overflow-y: auto;
  align-content: start;
}
.inv-item {
  display: flex;
  width: 100%;
  height: 68px;
  min-width: 0;
  min-height: 68px;
  flex-direction: column;
  align-items: stretch;
  padding: 3px;
  border: 1px solid var(--line);
  color: var(--text);
  text-align: left;
  background: rgba(8, 12, 15, .72);
}
.inv-item:hover:not(:disabled) {
  color: var(--amber);
  border-color: var(--amber);
  background: rgba(25, 30, 32, .95);
}
.inv-item[aria-disabled="true"] {
  opacity: .62;
}
.inv-empty-slot {
  height: 68px;
  border: 1px solid var(--line);
  background: rgba(8, 12, 15, .24);
}
.inv-context {
  position: absolute;
  z-index: 20;
  min-width: 124px;
  padding: 4px;
  border: 1px solid var(--line);
  background: rgba(7, 9, 11, .98);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .6);
}
.inv-context button {
  display: block;
  width: 100%;
  padding: 6px 10px;
  border: 0;
  text-align: left;
  font-size: 12px;
}
.inv-sell-popover {
  position: absolute;
  z-index: 25;
  width: min(220px, calc(100% - 16px));
  padding: 10px 12px;
  border: 1px solid var(--amber);
  background: rgba(7, 9, 11, .98);
  color: var(--ink);
  box-shadow: 0 8px 22px rgba(0, 0, 0, .7);
}
.inv-sell-popover > strong {
  display: block;
  margin-bottom: 8px;
  color: var(--ice);
  font-size: 13px;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.inv-sell-popover label {
  display: block;
  color: var(--dim);
  font-size: 12px;
}
.inv-sell-popover label span {
  color: var(--dim);
  font-size: 10px;
}
.inv-sell-amount {
  display: block;
  width: 100%;
  margin-top: 4px;
  padding: 5px 7px;
  border: 1px solid var(--line);
  color: var(--ink);
  background: #0d1216;
  font: inherit;
}
.inv-sell-error {
  min-height: 16px;
  margin-top: 3px;
  color: var(--red);
  font-size: 11px;
}
.inv-sell-actions {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  margin-top: 5px;
}
.inv-sell-actions button {
  padding: 4px 9px;
  font-size: 12px;
}
.inv-item-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2px;
}
.inv-kind {
  color: var(--dim);
  font-size: 9px;
  letter-spacing: .1em;
}
.inv-n {
  color: var(--amber);
  font-size: 12px;
}
.inv-item-name {
  display: -webkit-box;
  min-height: 0;
  overflow: hidden;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  font-size: 12px;
  line-height: 1.05;
  overflow-wrap: anywhere;
}
.inv-item-meta {
  display: block;
  margin-top: 1px;
  color: var(--dim);
  font-size: 10px;
}
.inv-switch {
  margin: 10px 0;
}
@media (max-width: 420px) {
  .inv-grid {
    grid-template-columns: repeat(5, minmax(0, 1fr));
    --inv-row-gap: 4px;
  }
  .inv-item {
    padding: 2px;
  }
}

/* Narrow screens: the ship first, then the bays in two columns. */
@media (max-width: 900px) {
  .outfit {
    grid-template-columns: 1fr;
  }
  .outfit-mid {
    order: -1;
  }
  .outfit-view {
    min-height: 300px;
  }
  .outfit-rail {
    grid-template-columns: 1fr 1fr;
  }
}

/* ---- Warp overlay (built in src/ui/warpflash.js) ---- */
/* Two full-screen gradients: a tunnel vignette and the white-out at arrival.
   Both are driven every frame from the warp clock (src/ui/warpflash.js), so the
   picture cannot drift from the simulation. Nothing here animates in CSS. */
#warpfx {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0;
}

#warpfx .v {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 50%,
      rgba(6, 10, 16, 0) 20%,
      rgba(6, 10, 16, 0.55) 62%,
      rgba(6, 10, 16, 0.92) 100%);
}

#warpfx .f {
  position: absolute;
  inset: 0;
  opacity: 0;
  background: radial-gradient(circle at 50% 50%,
      #ffffff 0%,
      rgba(206, 234, 255, 0.9) 22%,
      rgba(140, 190, 255, 0.25) 50%,
      rgba(140, 190, 255, 0) 70%);
}

/* ---- Pause overlay (built in src/ui/pause.js) ---- */
#pz {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(7,9,11,.7);
  text-align: center;
}
#pz[hidden] {
  display: none;
}
/* ---- Misc: confirmation text, save-code box ---- */
.ok {
  color: var(--ice);
}
textarea {
  width: 100%;
  margin-top: 8px;
  font: 13px/1.3 ui-monospace,monospace;
  color: var(--ink);
  background: #0d1215;
  border: 1px solid var(--line);
  padding: 8px;
  resize: vertical;
}

/* ---- Pause overlay layout: title, hint, Resume at the top, sound switch,
   Exit to main menu at the bottom (markup: ui/overlays.js) ---- */
#pz>div {
  display: grid;
  justify-items: center;
  gap: 18px;
}
#pz h1 {
  font-size: 72px;
  font-weight: 600;
  letter-spacing: .14em;
  text-indent: .14em;
  text-transform: uppercase;
  margin: 0;
}
#pz p {
  margin: 0;
  color: var(--dim);
}
#pz .sw {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 190px;
  padding: 8px 16px;
}
#pz .sw:hover:not(:disabled) {
  background: rgba(224,164,88,.14);
  color: var(--amber);
}
#pz .sw[aria-checked=false],
#pz .sw[aria-checked=false]:hover:not(:disabled) {
  color: var(--dim);
  border-color: var(--line);
}
#pz .sw i {
  position: relative;
  flex: none;
  width: 38px;
  height: 20px;
  border: 1px solid currentColor;
  border-radius: 10px;
}
#pz .sw i::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: currentColor;
  transition: transform .15s;
}
#pz .sw[aria-checked=true] i {
  background: var(--amber);
}
#pz .sw[aria-checked=true] i::after {
  transform: translateX(18px);
  background: #000;
}
@media(prefers-reduced-motion:reduce) {
  #flash {
    transition: none;
  }
  #pz .sw i::after {
    transition: none;
  }
}

/* ---- Starmap (step 11B, built in src/ui/starmap.js) ---- */
#starmap {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(7,9,11,.96);
  color: var(--ink);
}
#starmap[hidden] { display: none; }
.sm-shell { height: 100%; display: flex; flex-direction: column; padding: 22px; gap: 14px; }
.sm-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.sm-header h1 { letter-spacing: .08em; text-transform: uppercase; color: var(--amber); }
.sm-header p { margin: 2px 0 0; color: var(--dim); }
.sm-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) 280px; gap: 18px; }
.sm-chart-panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--line); background: #090d10; }
.sm-tools { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); color: var(--dim); }
.sm-tools strong { color: var(--ice); font-size: 15px; }
.sm-tools label { display: flex; align-items: center; gap: 8px; }
.sm-tools select { max-width: 230px; font: inherit; color: var(--ink); background: #0d1215; border: 1px solid var(--line); padding: 5px 8px; }
.sm-tools>div { display: flex; gap: 6px; }
.sm-tools button { padding: 4px 10px; }
.sm-chart { flex: 1; min-height: 0; width: 100%; cursor: grab; touch-action: none; user-select: none; }
.sm-chart:active { cursor: grabbing; }
.sm-chart.transitioning { cursor: progress; }
.sm-edge { fill: none; stroke: #344650; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
.sm-pocket-edge { stroke: #4a6a75; }
/* Central bodies are visual chart objects, never pocket buttons. */
.sm-core { cursor: help; outline: none; }
.sm-core-glow, .sm-core-ring, .sm-core-body, .sm-core-label { pointer-events: none; }
.sm-core-hit { fill: transparent; stroke: none; pointer-events: all; }
.sm-core.star .sm-core-glow { fill: #e8b963; opacity: .09; }
.sm-core.star .sm-core-body { fill: #ffe2a0; stroke: #fff3cf; stroke-width: 1; vector-effect: non-scaling-stroke; }
.sm-core.star .sm-core-ring { fill: none; stroke: #dca451; opacity: .5; stroke-width: 1; vector-effect: non-scaling-stroke; }
.sm-core.black-hole .sm-core-glow { fill: #9e87cb; opacity: .13; }
.sm-core.black-hole .sm-core-body { fill: #020305; stroke: #ae96d6; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.sm-core.black-hole .sm-core-ring { fill: none; stroke: #dfb779; stroke-width: 2; opacity: .8; vector-effect: non-scaling-stroke; }
.sm-core:hover .sm-core-ring, .sm-core:focus .sm-core-ring { stroke: #fff; opacity: 1; stroke-width: 2; }
.sm-core:hover .sm-core-glow, .sm-core:focus .sm-core-glow { opacity: .24; }
.sm-core-label { fill: var(--ice); paint-order: stroke; stroke: #07090b; stroke-linejoin: round; }
.sm-core-type { fill: var(--dim); }
.sm-exit { cursor: pointer; outline: none; }
/* Gate exits and their remote endpoint are the same blue as a pocket dot. */
.sm-exit-edge { stroke: #5a7a86; stroke-dasharray: 5 4; pointer-events: none; }
.sm-exit-hit { fill: transparent; stroke: none; pointer-events: all; }
.sm-exit-cap { fill: #5a7a86; pointer-events: none; }
.sm-exit text { fill: var(--ice); paint-order: stroke; stroke: #07090b; stroke-linejoin: round; pointer-events: auto; }
.sm-exit:hover .sm-exit-cap, .sm-exit:focus .sm-exit-cap { fill: #fff; stroke: #5a7a86; stroke-width: 2; }
.sm-exit:hover text, .sm-exit:focus text { fill: #5a7a86; }
.sm-node { cursor: pointer; outline: none; }
.sm-node .sm-hit { fill: transparent; stroke: none; pointer-events: all; }
.sm-node .sm-dot { fill: #40515b; stroke: #71858f; stroke-width: 1; vector-effect: non-scaling-stroke; }
.sm-node.current .sm-dot { fill: var(--amber); stroke: var(--amber); }
.sm-pocket-node .sm-dot { fill: #5a7a86; stroke: var(--ice); }
.sm-pocket-node.current .sm-dot { fill: var(--amber); stroke: var(--amber); }
.sm-node.route-start .sm-dot { fill: var(--amber); stroke: #ffd58e; }
.sm-node.route-destination .sm-dot { fill: #07090b; stroke: var(--amber); }
.sm-node.route-intermediate .sm-dot { fill: #5a7a86; stroke: var(--ice); }
.sm-route-marker { fill: none; pointer-events: none; vector-effect: non-scaling-stroke; }
.sm-route-marker-destination-outer { stroke: var(--amber); stroke-width: 1; stroke-dasharray: 1 3; stroke-linecap: round; opacity: .95; }
.sm-route-marker-destination-check { fill: none; stroke: var(--amber); stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
.sm-station-dot { shape-rendering: geometricPrecision; }
.sm-node .sm-ring { fill: none; stroke: var(--ink); stroke-dasharray: 3 3; pointer-events: none; }
.sm-label-link { stroke: var(--dim); stroke-width: 1; stroke-dasharray: 2 2; opacity: .75; vector-effect: non-scaling-stroke; pointer-events: none; }
.sm-node:hover .sm-dot, .sm-node:focus .sm-dot { stroke: #fff; stroke-width: 2; }
.sm-node text { fill: var(--ink); font-size: 11px; paint-order: stroke; stroke: #07090b; stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.sm-node.current text { fill: var(--amber); }
.sm-here-label { fill: var(--amber); font-size: .85em; }
.sm-notice { margin: 6px 0 0; color: var(--amber); }
.sm-help { margin: 0; padding: 9px 12px; border-top: 1px solid var(--line); color: var(--dim); font-size: 13px; }
.sm-details { min-height: 0; overflow: visible; border: 1px solid var(--line); padding: 14px; background: rgba(13,18,21,.8); }
.sm-details h2 { margin: 0 0 6px; font-size: 22px; color: var(--ice); }
.sm-current { margin: 0 0 10px; color: var(--ink); font-size: 14px; }
.sm-current span { color: var(--dim); margin-right: 6px; }
.sm-details h3 { margin: 8px 0 6px; text-transform: uppercase; letter-spacing: .05em; font-size: 13px; color: var(--amber); }
.sm-pockets { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.sm-pocket { padding: 4px 8px; border-left: 2px solid transparent; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; }
.sm-pocket.here { border-left-color: var(--amber); color: var(--amber); background: rgba(224,164,88,.08); }
.sm-context { position: fixed; z-index: 50; display: grid; gap: 8px; padding: 10px; background: #0d1215; border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.sm-context strong { color: var(--ice); font-size: 14px; }
.sm-context button { width: 100%; padding: 6px 8px; }
.sm-context-note { margin: 0; color: var(--dim); font-size: 13px; }
@media (max-width: 850px) {
  .sm-shell { padding: 12px; }
  .sm-body { grid-template-columns: 1fr; grid-template-rows: minmax(240px,55%) minmax(0,1fr); }
  .sm-header h1 { font-size: 24px; }
  .sm-header p { font-size: 13px; }
  .sm-pockets { grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); }
}

/* Navigation remains compact without making the system overview scroll. */
.sm-system-route { pointer-events: none; }
.sm-system-route line { stroke: var(--amber); stroke-width: 3; vector-effect: non-scaling-stroke; }
.sm-system-route-arrow, .sm-route-arrow { fill: var(--amber); pointer-events: none; }
.sm-route-edge { fill: none; stroke: var(--amber); stroke-width: 3; vector-effect: non-scaling-stroke; pointer-events: none; }
.sm-route-exit-edge { fill: none; stroke: var(--amber); stroke-width: 3; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; pointer-events: none; }
.sm-route { position: relative; margin-top: 12px; padding-top: 4px; border-top: 1px solid var(--line); }
.sm-route h3 { white-space: normal; overflow-wrap: anywhere; }
.sm-route ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.sm-route li { color: var(--ink); font-size: 13px; line-height: 18px; overflow-wrap: anywhere; }
.sm-route .sm-route-measure { position: absolute; visibility: hidden; pointer-events: none; top: 0; left: 0; width: 100%; }
.sm-route li span { color: var(--amber); }
.sm-route li small { color: var(--dim); }
.sm-route p { margin: 6px 0; color: var(--dim); font-size: 12px; }
.sm-route-actions { display: flex; align-items: center; gap: 6px; }
.sm-route-actions button { padding: 3px 8px; }
