<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tallow Reach</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Tallow Reach styles. Colours are the variables in :root. Sections: page, flight HUD, outpost panel, pause overlay. */

/* ---- Page ---- */
:root {
  --bg:#07090b;
  --ink:#c9d1d6;
  --dim:#6f7b84;
  --amber:#e0a458;
  --red:#d0503f;
  --ice:#7fb7c4;
  --line:#27323a;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.4 "Barlow Semi Condensed",system-ui,sans-serif;
  overflow: hidden;
}

canvas {
  display: block;
  position: fixed;
  inset: 0;
  cursor: none;
}

/* ---- Flight HUD (top-left bars, top-right info, centre messages, markers) ---- */
#hud>div {
  position: fixed;
  pointer-events: none;
  text-shadow: 0 1px 3px #000;
}

#tl {
  left: 20px;
  top: 20px;
  width: 210px;
}
#tr {
  right: 20px;
  top: 20px;
  text-align: right;
  max-width: 340px;
}
#bc {
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  text-align: center;
}

#hint {
  left: 20px;
  bottom: 20px;
  color: var(--dim);
  font-size: 13px;
  max-width: 300px;
}

#pr {
  left: 50%;
  top: 62%;
  transform: translateX(-50%);
  color: var(--amber);
  text-align: center;
}

#cur {
  width: 14px;
  height: 14px;
  border: 1px solid var(--amber);
  border-radius: 50%;
  transform: translate(-50%,-50%);
  left: 50%;
  top: 50%;
}

#mcone {
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  border: 1px dashed rgba(224,164,88,.22);
  border-radius: 50%;
  display: none;
}

#retc {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  pointer-events: none;
}

#ctr {
  left: 50%;
  top: 50%;
  width: 4px;
  height: 4px;
  background: var(--ink);
  border-radius: 50%;
  transform: translate(-50%,-50%);
  opacity: .6;
}

.bar {
  height: 6px;
  background: #141b20;
  margin: 4px 0 10px;
}
.bar i {
  display: block;
  height: 100%;
  width: 50%;
}

#msg {
  left: 50%;
  top: 14%;
  transform: translateX(-50%);
  color: var(--ink);
  font-size: 18px;
}

.mk {
  position: fixed;
  display: none;
  transform: translate(-50%,-50%);
  font-size: 12px;
  color: var(--amber);
  border: 1px solid currentColor;
  padding: 1px 6px;
  background: rgba(7,9,11,.5);
  white-space: nowrap;
  pointer-events: none;
}
.mk.h {
  color: var(--red);
}
.mk.i {
  color: var(--ice);
}
.mk.dim {
  opacity: .55;
}
.mk.lock {
  background: rgba(224,164,88,.22);
  color: #ffe2b8;
}
.mk.lock.h {
  background: rgba(208,80,63,.25);
  color: #ffb4a8;
}
.mk.lk {
  width: 36px;
  height: 36px;
  padding: 0;
  background: none;
}

#flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 160px 40px var(--red);
  opacity: 0;
  transition: opacity .4s;
}

/* ---- Outpost panel (docked screens) ---- */
#panel {
  position: fixed;
  right: 0;
  top: 0;
  bottom: 0;
  width: min(580px,100%);
  padding: 28px;
  background: rgba(7,9,11,.9);
  backdrop-filter: blur(6px);
  border-left: 1px solid var(--line);
  overflow: auto;
}

/* ---- Shared text and buttons ---- */
h1 {
  font-size: 30px;
  font-weight: 600;
  margin: 0 0 2px;
}
h2 {
  font-size: 18px;
  margin: 22px 0 6px;
  font-weight: 600;
}
.sub {
  color: var(--dim);
  margin-bottom: 14px;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

button {
  font: inherit;
  color: var(--amber);
  background: transparent;
  border: 1px solid var(--amber);
  padding: 5px 14px;
  cursor: pointer;
}

button:hover:not(:disabled),
button.on {
  background: var(--amber);
  color: #000;
}
button:disabled {
  color: var(--dim);
  border-color: var(--line);
  cursor: default;
}

button:focus-visible {
  outline: 2px solid var(--ice);
  outline-offset: 2px;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.row small {
  color: var(--dim);
  display: block;
}

.go {
  margin-top: 22px;
  width: 100%;
  padding: 10px;
  font-size: 18px;
}
/* ---- Outfitting: the ship in the middle, module bays around it ---- */
/* This tab opens the panel up to the middle of the screen, because the ship
   needs room to be looked at. Everything else stays where it was. */
#panel.wide {
  left: 0;
  right: 0;
  margin: 0 auto;
  width: min(1180px, 100%);
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
}

.outfit {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(300px, 1.35fr) minmax(0, 1fr);
  gap: 14px;
  align-items: start;
}

.outfit-rail {
  display: grid;
  gap: 10px;
}

/* One module group. The same shape is used for every group, so a new entry in
   MODULE_GROUPS (src/data/outfitting.js) needs no styling of its own. */
.mod {
  border: 1px solid var(--line);
  background: rgba(20, 27, 32, .55);
  padding: 9px 11px 10px;
}
.mod header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}
.mod h3 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .07em;
  text-transform: uppercase;
}
.mod-count {
  color: var(--dim);
  font-size: 12px;
  white-space: nowrap;
}
.mod-bays {
  display: flex;
  gap: 8px;
}
.mod-bay {
  flex: 1;
  min-width: 0;
  display: grid;
  gap: 1px;
  padding: 6px 8px 7px;
  border: 1px dashed var(--line);
  background: repeating-linear-gradient(
    135deg,
    transparent 0 6px,
    rgba(127, 183, 196, .05) 6px 12px
  );
}
.bay-no {
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--dim);
}
.bay-empty {
  font-size: 13px;
  color: #57656e;
}
.mod p {
  margin: 8px 0 0;
  font-size: 12px;
  line-height: 1.25;
  color: var(--dim);
}

/* The window the ship is shown in. Its own canvas, its own renderer; see
   render/shipviewer.js. The gradients sit behind the transparent canvas. */
.outfit-view {
  position: relative;
  min-height: 460px;
  border: 1px solid var(--line);
  overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 38%, rgba(127, 183, 196, .10), transparent 62%),
    radial-gradient(90% 70% at 50% 102%, rgba(224, 164, 88, .10), transparent 72%),
    #070a0c;
}
.outfit-stage {
  position: absolute;
  inset: 0;
}
.outfit-stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  cursor: grab;
  touch-action: none;
}
.outfit-stage canvas.dragging {
  cursor: grabbing;
}
.outfit-title {
  position: absolute;
  left: 14px;
  top: 12px;
  z-index: 2;
  pointer-events: none;
  font-size: 15px;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.outfit-title small {
  display: block;
  margin-top: 1px;
  font-size: 12px;
  letter-spacing: 0;
  text-transform: none;
  color: var(--dim);
}
.outfit-tip {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 9px;
  z-index: 2;
  padding: 0 12px;
  text-align: center;
  font-size: 11px;
  letter-spacing: .05em;
  color: var(--dim);
  pointer-events: none;
}
.outfit-stage.no-webgl .outfit-tip {
  top: 50%;
  bottom: auto;
  transform: translateY(-50%);
}

/* Narrow screens: the ship first, then the bays in two columns. */
@media (max-width: 900px) {
  .outfit {
    grid-template-columns: 1fr;
  }
  .outfit-view {
    order: -1;
    min-height: 300px;
  }
  .outfit-rail {
    grid-template-columns: 1fr 1fr;
  }
}

/* ---- Warp overlay (built in src/ui/warpflash.js) ---- */
/* Two full-screen gradients: a tunnel vignette and the white-out at arrival.
   Both are driven every frame from the warp clock (src/ui/warpflash.js), so the
   picture cannot drift from the simulation. Nothing here animates in CSS. */
#warpfx {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0;
}

#warpfx .v {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 50%,
      rgba(6, 10, 16, 0) 20%,
      rgba(6, 10, 16, 0.55) 62%,
      rgba(6, 10, 16, 0.92) 100%);
}

#warpfx .f {
  position: absolute;
  inset: 0;
  opacity: 0;
  background: radial-gradient(circle at 50% 50%,
      #ffffff 0%,
      rgba(206, 234, 255, 0.9) 22%,
      rgba(140, 190, 255, 0.25) 50%,
      rgba(140, 190, 255, 0) 70%);
}

/* ---- Pause overlay (built in src/ui/pause.js) ---- */
#pz {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(7,9,11,.7);
  text-align: center;
}
#pz[hidden] {
  display: none;
}
/* ---- Misc: confirmation text, save-code box ---- */
.ok {
  color: var(--ice);
}
textarea {
  width: 100%;
  margin-top: 8px;
  font: 13px/1.3 ui-monospace,monospace;
  color: var(--ink);
  background: #0d1215;
  border: 1px solid var(--line);
  padding: 8px;
  resize: vertical;
}

/* ---- Pause overlay layout: title, hint, sound switch, Resume ---- */
#pz>div {
  display: grid;
  justify-items: center;
  gap: 18px;
}
#pz h1 {
  font-size: 72px;
  font-weight: 600;
  letter-spacing: .14em;
  text-indent: .14em;
  text-transform: uppercase;
  margin: 0;
}
#pz p {
  margin: 0;
  color: var(--dim);
}
#pz .sw {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 190px;
  padding: 8px 16px;
}
#pz .sw:hover:not(:disabled) {
  background: rgba(224,164,88,.14);
  color: var(--amber);
}
#pz .sw[aria-checked=false],
#pz .sw[aria-checked=false]:hover:not(:disabled) {
  color: var(--dim);
  border-color: var(--line);
}
#pz .sw i {
  position: relative;
  flex: none;
  width: 38px;
  height: 20px;
  border: 1px solid currentColor;
  border-radius: 10px;
}
#pz .sw i::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: currentColor;
  transition: transform .15s;
}
#pz .sw[aria-checked=true] i {
  background: var(--amber);
}
#pz .sw[aria-checked=true] i::after {
  transform: translateX(18px);
  background: #000;
}
@media(prefers-reduced-motion:reduce) {
  #flash {
    transition: none;
  }
  #pz .sw i::after {
    transition: none;
  }
}

</style>
</head>
<body>
<div id="hud" hidden>
<div id="tl"><div>Shield</div><div class="bar"><i id="b1" style="background:var(--ice)"></i></div><div>Hull</div><div class="bar"><i id="b2" style="background:var(--ink)"></i></div><div>Boost</div><div class="bar"><i id="b3" style="background:var(--amber)"></i></div></div>
<div id="tr"></div><div id="bc"></div><div id="hint">Mouse steer. W/S throttle, A/D strafe, Space/C up and down, Q/E roll, Shift boost, X stop. Left click primary, right click secondary, 1/2 switch primary, F target lock, G dock, M warp to the next sector, P pause, hold Left Alt for free cam.</div>
<div id="pr"></div><div id="msg"></div><div id="cur"></div><div id="ctr"></div><div id="mcone"></div><canvas id="retc" width="160" height="160"></canvas></div>
<div id="mk"></div><div id="flash"></div><div id="panel"></div>
