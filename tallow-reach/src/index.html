<body>
<div id="hud" hidden>
<div id="tl"><div class="tl-label tl-shield">Shield HP<span id="sh-val"></span></div><div class="bar"><i id="b1" style="background:var(--ice)"></i></div><div class="tl-label tl-hull">Hull HP<span id="hull-val"></span></div><div class="bar"><i id="b2" style="background:var(--ink)"></i></div><div class="tl-label tl-boost">Boost<span id="boost-val"></span></div><div class="bar"><i id="b3" style="background:var(--amber)"></i></div></div>
<div id="tr"></div><div id="bc"></div>
<div id="pw"><div class="pw-line"><span>Power cell</span><span id="pw-val"></span></div><div class="bar"><i id="pwbar" style="width:100%;background:var(--ice)"></i></div><div id="pw-flow"></div></div><div id="hint">Mouse steer. W/S throttle, A/D strafe, Space/C up and down, Q/E roll, Shift boost, X stop. Left click primary, right click secondary, 1/2 switch primary, F target lock, G dock, <span id="warp-hint">M starmap</span>, P pause, hold Left Alt for free cam.</div>
<div id="pr"></div><div id="bm" hidden><div class="bm-line"><span id="bm-name">Basic mining beam</span><span id="bm-pct">0%</span></div><div class="bar"><i id="bmbar" style="width:0;background:var(--amber)"></i></div></div><div id="msg"></div><div id="cur"></div><div id="ctr"></div><div id="mcone"></div><canvas id="retc" width="160" height="160"></canvas></div>
<div id="mk"></div><div id="flash"></div><div id="panel"></div>
